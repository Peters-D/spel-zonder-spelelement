name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxcontrole van alle JavaScript-bestanden
        run: |
          for f in js/*.js tests/*.js tools/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Rooktest (laden + vaste seeds + live spel)
        run: node tests/smoke.js
      - name: README klopt met de regels
        run: |
          node tests/readme-check.js
          node tools/build-readme.js --check
